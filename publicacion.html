<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario para crear una nueva publicación con contenido y archivo opcional.">
    <title>Nueva Publicación</title>
    <link rel="stylesheet" href="publicacion.css">
</head>

<body>
    <div class="form-container">
        <h1>Nueva Publicación</h1>
        <form id="publicacionForm" action="http://localhost/publicar" method="POST" enctype="multipart/form-data">
            <!-- Contenido -->
            <div class="form-group">
                <label for="contenido">Contenido:</label>
                <textarea id="contenido" name="contenido" rows="5" required
                    aria-describedby="contenido-error"></textarea>
                <p id="contenido-error" class="error-message hidden">El contenido es obligatorio.</p>
            </div>

            <!-- Archivo -->
            <div class="form-group">
                <label for="archivo">Archivo (opcional, solo imágenes o PDF):</label>
                <input type="file" id="archivo" name="archivo" accept="image/*,.pdf">
                <p id="archivo-error" class="error-message hidden">Solo se permiten archivos de imagen o PDF.</p>
            </div>

            <!-- Autor -->
            <div class="form-group">
                <label for="autor">ID del Autor:</label>
                <input type="number" id="autor" name="autor" min="1" required aria-describedby="autor-error">
                <p id="autor-error" class="error-message hidden">El ID del autor debe ser un número positivo.</p>
            </div>

            <!-- Botones -->
            <div class="button-group">
                <button type="submit">Publicar</button>
                <button type="reset">Limpiar</button>
            </div>
        </form>
    </div>

    <!-- Script con un solo método -->
    <script>

        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('publicacionForm');

            form.addEventListener('submit', async function (event) {
                event.preventDefault();

                let isValid = true;
                const contenido = document.getElementById('contenido');
                const autor = document.getElementById('autor');
                const archivo = document.getElementById('archivo');

                const contenidoError = document.getElementById('contenido-error');
                const autorError = document.getElementById('autor-error');
                const archivoError = document.getElementById('archivo-error');

                // Limpiar errores
                [contenidoError, autorError, archivoError].forEach(el => el.classList.add('hidden'));

                // Validaciones
                if (!contenido.value.trim()) {
                    contenidoError.classList.remove('hidden');
                    isValid = false;
                }
                const autorValue = parseInt(autor.value);
                if (isNaN(autorValue) || autorValue <= 0) {
                    autorError.classList.remove('hidden');
                    isValid = false;
                }
                if (archivo.files.length > 0) {
                    const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'application/pdf'];
                    if (!validTypes.includes(archivo.files[0].type)) {
                        archivoError.classList.remove('hidden');
                        isValid = false;
                    }
                }
                if (!isValid) return;

                // Armar FormData
                const formData = new FormData();
                formData.append('contenido', contenido.value.trim());
                formData.append('autor', autor.value);
                if (archivo.files.length) {
                    formData.append('archivo', archivo.files[0]);
                }

                // Aquí pones tu fetch al puerto 3000
                try {
                    const res = await fetch('http://localhost:3000/publicar', {
                        method: 'POST',
                        body: formData
                    });
                    if (res.ok) {
                        alert('¡Publicado con éxito!');
                        form.reset();
                    } else {
                        const err = await res.text();
                        alert('Error al publicar: ' + err);
                    }
                } catch (e) {
                    alert('Error de red: ' + e.message);
                }
            });
        });


    </script>
</body>
