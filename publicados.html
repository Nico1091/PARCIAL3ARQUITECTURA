<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicaciones - RedSocialPro</title>
    <link rel="stylesheet" href="publicados.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <h1><span style="font-size:24px;">Ⓡ</span> RedSocialPro</h1>
        <div class="user-info">
            <span id="userName" style="color: white; margin-right: 15px;">Usuario</span>
            <button id="btnCerrarSesion" class="btn-action" type="button" onclick="cerrarSesion()">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="publications-header">
            <h2>Publicaciones</h2>
            <button id="btnNuevaPublicacion" class="btn-primary">
                <i class="fas fa-plus"></i> Nueva Publicación
            </button>
        </div>

        <div id="publicacionesContainer" class="publications-grid">
            <!-- Las publicaciones se cargarán aquí dinámicamente -->
        </div>
    </main>

    <!-- Modal para nueva publicación -->
    <div id="modalPublicacion" class="modal">
        <div class="modal-content">
            <h3>Nueva Publicación</h3>
            <textarea id="contenidoPublicacion" placeholder="¿Qué quieres compartir?"></textarea>
            <div class="file-upload">
                <label for="archivoPublicacion">
                    <i class="fas fa-paperclip"></i> Adjuntar archivo
                </label>
                <input type="file" id="archivoPublicacion" hidden>
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-primary" onclick="publicar()">Publicar</button>
            </div>
        </div>
    </div>

    <!-- Modal de vista previa -->
    <div id="previewModal" class="preview-modal">
        <div class="preview-modal-content">
            <button onclick="closePreviewModal()" class="close-preview">
                <i class="fas fa-times"></i>
            </button>
            <div class="preview-container"></div>
        </div>
    </div>

    <script>
        // Cache para PDFs
        const pdfCache = new Map();

        // Verificar autenticación al cargar la página
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');

            if (!token || !usuario) {
                window.location.href = 'index.html?logout=true';
                return;
            }

            try {
                const res = await fetch('http://localhost:3000/verificar-token', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    throw new Error('Token inválido');
                }

                document.getElementById('userName').textContent = usuario.nombre;
                cargarPublicaciones();

            } catch (error) {
                console.error('Error al verificar token:', error);
                window.location.href = 'index.html?logout=true';
            }
        });

        // Función para generar vista previa optimizada de PDF
        function generarVistaPreviaPDF(data, mimeType, id) {
            return `
                <div class="file-preview">
                    <div class="pdf-preview-placeholder" data-pdf-id="${id}">
                        <i class="fas fa-file-pdf" style="font-size: 3rem; color: var(--primary-color);"></i>
                        <p>Vista previa PDF</p>
                        <button onclick="cargarPDFCompleto('${id}', '${data}', '${mimeType}')" class="btn-secondary">
                            Cargar PDF
                        </button>
                    </div>
                </div>
            `;
        }

        // Función para cargar PDF completo
        async function cargarPDFCompleto(id, data, mimeType) {
            const placeholder = document.querySelector(`[data-pdf-id="${id}"]`);
            if (!placeholder) return;

            // Verificar si ya está en caché
            if (pdfCache.has(id)) {
                placeholder.innerHTML = pdfCache.get(id);
                return;
            }

            // Mostrar indicador de carga
            placeholder.innerHTML = `
                <div class="loading-indicator">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Cargando PDF...</p>
                </div>
            `;

            try {
                // Intentar cargar el PDF de diferentes maneras
                const pdfUrl = `data:${mimeType};base64,${data}`;
                
                // Verificar si el PDF es válido
                const response = await fetch(pdfUrl);
                if (!response.ok) throw new Error('PDF inválido');

                const html = `
                    <iframe src="${pdfUrl}" 
                            class="pdf-preview" 
                            title="Vista previa PDF"
                            loading="lazy"></iframe>
                `;

                placeholder.innerHTML = html;
                pdfCache.set(id, html);
            } catch (error) {
                console.error('Error al cargar PDF:', error);
                placeholder.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Error al cargar el PDF. <a href="data:${mimeType};base64,${data}" download="archivo.pdf">Descargar</a></p>
                    </div>
                `;
            }
        }

        // Función para eliminar publicación
        async function eliminarPublicacion(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar esta publicación?')) {
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`http://localhost:3000/publicacion/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Error al eliminar la publicación');
                }

                // Eliminar la publicación de la vista
                const fila = document.querySelector(`tr[data-publicacion-id="${id}"]`);
                if (fila) {
                    fila.remove();
                    // Si no hay más publicaciones, mostrar mensaje
                    const tbody = document.querySelector('.publications-table tbody');
                    if (!tbody.children.length) {
                        document.getElementById('publicacionesContainer').innerHTML = `
                            <div class="no-publications">
                                <i class="fas fa-newspaper" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
                                <p>No hay publicaciones disponibles en este momento.</p>
                                <button onclick="cargarPublicaciones()" class="btn-primary" style="margin-top: 1rem;">
                                    <i class="fas fa-sync"></i> Actualizar
                                </button>
                            </div>
                        `;
                    }
                }

            } catch (error) {
                console.error('Error:', error);
                alert(error.message || 'Error al eliminar la publicación');
            }
        }

        async function cargarPublicaciones() {
            try {
                const token = localStorage.getItem('token');
                const usuario = JSON.parse(localStorage.getItem('usuario'));
                const res = await fetch('http://localhost:3000/obtener-publicaciones', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    if (res.status === 404) {
                        throw new Error('El servicio de publicaciones no está disponible temporalmente');
                    } else if (res.status === 401) {
                        localStorage.clear();
                        window.location.href = 'index.html?logout=true';
                        return;
                    } else {
                        throw new Error('Error al conectar con el servidor');
                    }
                }

                const publicaciones = await res.json();
                const container = document.getElementById('publicacionesContainer');
                
                if (!publicaciones || publicaciones.length === 0) {
                    container.innerHTML = `
                        <div class="no-publications">
                            <i class="fas fa-newspaper" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
                            <p>No hay publicaciones disponibles en este momento.</p>
                            <button onclick="cargarPublicaciones()" class="btn-primary" style="margin-top: 1rem;">
                                <i class="fas fa-sync"></i> Actualizar
                            </button>
                        </div>
                    `;
                    return;
                }

                let tablaHTML = `
                    <table class="publications-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Contenido</th>
                                <th>Fecha</th>
                                <th>Autor</th>
                                <th>Archivos</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                publicaciones.forEach(pub => {
                    const fecha = new Date(pub.fecha).toLocaleDateString('es-ES', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    let archivosHTML = '';
                    if (pub.archivo) {
                        try {
                            const { data, mimeType } = pub.archivo;
                            
                            if (mimeType.startsWith('image/')) {
                                archivosHTML = `
                                    <div class="file-preview">
                                        <img src="data:${mimeType};base64,${data}" 
                                             alt="Vista previa" 
                                             class="preview-image"
                                             loading="lazy"
                                             onclick="openFilePreview('${data}', '${mimeType}')">
                                    </div>
                                `;
                            } else if (mimeType === 'application/pdf') {
                                archivosHTML = generarVistaPreviaPDF(data, mimeType, pub.id_publicacion);
                            } else {
                                archivosHTML = `
                                    <div class="file-preview">
                                        <i class="fas fa-file-alt"></i>
                                        <p>Archivo adjunto</p>
                                    </div>
                                `;
                            }
                            
                            archivosHTML += `
                                <div class="file-actions">
                                    <a href="data:${mimeType};base64,${data}" 
                                       download="archivo_${pub.id_publicacion}"
                                       class="download-link">
                                        <i class="fas fa-download"></i> Descargar
                                    </a>
                                    <button onclick="openFilePreview('${data}', '${mimeType}')" 
                                            class="preview-link">
                                        <i class="fas fa-eye"></i> Ver
                                    </button>
                                </div>
                            `;
                        } catch (error) {
                            console.error('Error al procesar archivo:', error);
                            archivosHTML = '<span class="error-text">Error al cargar archivo</span>';
                        }
                    } else {
                        archivosHTML = '<span class="no-file">Sin archivo</span>';
                    }

                    // Verificar si el usuario actual es el autor o es administrador
                    const esAutor = usuario.id_usuario === pub.autor;
                    const esAdmin = usuario.id_perfil === 2;
                    const puedeEliminar = esAutor || esAdmin;

                    // Preparar botones de acción
                    let botonesAccion = '';
                    if (puedeEliminar) {
                        botonesAccion = `
                            <button onclick="eliminarPublicacion(${pub.id_publicacion})" class="btn-danger" title="${esAdmin ? 'Eliminar como administrador' : 'Eliminar tu publicación'}">
                                <i class="fas fa-trash"></i> Eliminar
                            </button>
                        `;
                    }

                    tablaHTML += `
                        <tr data-publicacion-id="${pub.id_publicacion}" ${esAutor ? 'class="publicacion-propia"' : ''}>
                            <td>${pub.id_publicacion}</td>
                            <td>${pub.contenido || 'Sin contenido'}</td>
                            <td>${fecha}</td>
                            <td>${pub.nombre || 'Desconocido'} ${esAutor ? '<span class="badge-autor">Tú</span>' : ''}</td>
                            <td>${archivosHTML}</td>
                            <td>${botonesAccion}</td>
                        </tr>
                    `;
                });

                tablaHTML += `
                        </tbody>
                    </table>
                `;

                container.innerHTML = tablaHTML;

            } catch (error) {
                console.error('Error al cargar publicaciones:', error);
                const container = document.getElementById('publicacionesContainer');
                container.innerHTML = `
                    <div class="error-message" style="text-align: center; padding: 2rem;">
                        <i class="fas fa-exclamation-circle" style="font-size: 2rem; color: var(--danger-color); margin-bottom: 1rem;"></i>
                        <p>${error.message}</p>
                        <button onclick="cargarPublicaciones()" class="btn-primary" style="margin-top: 1rem;">
                            <i class="fas fa-sync"></i> Reintentar
                        </button>
                    </div>
                `;
            }
        }

        // Cargar publicaciones al iniciar
        document.addEventListener('DOMContentLoaded', cargarPublicaciones);

        async function cerrarSesion() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('http://localhost:3000/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    throw new Error('Error al cerrar sesión');
                }

            } catch (error) {
                console.error('Error:', error);
            } finally {
                localStorage.clear();
                window.location.href = 'index.html?logout=true';
            }
        }

        // Funciones para el modal de nueva publicación
        document.getElementById('btnNuevaPublicacion').addEventListener('click', () => {
            document.getElementById('modalPublicacion').style.display = 'flex';
        });

        function cerrarModal() {
            document.getElementById('modalPublicacion').style.display = 'none';
            document.getElementById('contenidoPublicacion').value = '';
            document.getElementById('archivoPublicacion').value = '';
        }

        async function publicar() {
            const contenido = document.getElementById('contenidoPublicacion').value;
            const archivo = document.getElementById('archivoPublicacion').files[0];
            const token = localStorage.getItem('token');

            if (!contenido.trim()) {
                alert('Por favor, escribe algo para publicar');
                return;
            }

            const formData = new FormData();
            formData.append('contenido', contenido);
            if (archivo) {
                formData.append('archivo', archivo);
            }

            try {
                const res = await fetch('http://localhost:3000/publicar', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (!res.ok) {
                    throw new Error('Error al crear la publicación');
                }

                cerrarModal();
                cargarPublicaciones();

            } catch (error) {
                console.error('Error:', error);
                alert('Error al crear la publicación');
            }
        }

        // Función para detectar el tipo MIME del archivo
        function detectMimeType(base64String) {
            try {
                const header = atob(base64String).slice(0, 4);
                const signatures = {
                    '/9j/': 'image/jpeg',    // JPEG
                    'iVBO': 'image/png',     // PNG
                    'R0lG': 'image/gif',     // GIF
                    'UklG': 'image/webp',    // WEBP
                    'JVBERi0': 'application/pdf', // PDF
                    'JVBER': 'application/pdf'    // PDF también
                };
                
                for (let [signature, mimeType] of Object.entries(signatures)) {
                    if (header.includes(signature)) {
                        return mimeType;
                    }
                }
                return 'application/octet-stream';
            } catch (e) {
                return 'application/octet-stream';
            }
        }

        // Función para abrir la vista previa en modal
        function openFilePreview(base64Data, mimeType) {
            const modal = document.getElementById('previewModal') || createPreviewModal();
            const previewContainer = modal.querySelector('.preview-container');
            
            if (mimeType.startsWith('image/')) {
                previewContainer.innerHTML = `
                    <img src="data:${mimeType};base64,${base64Data}" 
                         alt="Vista previa" 
                         class="full-preview-image">
                `;
            } else if (mimeType === 'application/pdf') {
                previewContainer.innerHTML = `
                    <iframe src="data:application/pdf;base64,${base64Data}" 
                            class="full-preview-pdf" 
                            title="Vista previa PDF"></iframe>
                `;
            } else {
                previewContainer.innerHTML = `
                    <div class="unsupported-file">
                        <i class="fas fa-file-alt"></i>
                        <p>Este tipo de archivo no se puede previsualizar</p>
                    </div>
                `;
            }
            
            modal.style.display = 'flex';
        }

        // Función para crear el modal de vista previa
        function createPreviewModal() {
            const modal = document.createElement('div');
            modal.id = 'previewModal';
            modal.className = 'preview-modal';
            modal.innerHTML = `
                <div class="preview-modal-content">
                    <button onclick="closePreviewModal()" class="close-preview">
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="preview-container"></div>
                </div>
            `;
            document.body.appendChild(modal);

            // Cerrar modal al hacer clic fuera
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closePreviewModal();
                }
            });

            return modal;
        }

        // Función para cerrar el modal de vista previa
        function closePreviewModal() {
            const modal = document.getElementById('previewModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
