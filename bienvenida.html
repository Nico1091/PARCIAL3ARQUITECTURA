<!DOCTYPE html>
<!-- Declaración del tipo de documento HTML5 -->
<html lang="es">
<!-- Etiqueta raíz del documento, especifica que el idioma principal es español -->

<head>
    <!-- Sección de metadatos y recursos del documento -->
    <meta charset="UTF-8">
    <!-- Especifica la codificación de caracteres como UTF-8 (incluye caracteres especiales y acentos) -->
    <title>Bienvenida</title>
    <!-- Título que aparece en la pestaña del navegador -->
     <link rel="stylesheet" href="bienvenida.css">
</head>

<body>

               <div class="profile-container">
                <!-- Header del perfil -->
                <header class="profile-header">
                    <div class="logo-container">
                        <span class="logo">Ⓡ</span>
                        <h1>RedSocialPro</h1>
                    </div>
                    
                    <div class="profile-main-info">
                        <img id="user-photo" src="" alt="Foto de perfil" class="profile-photo">
                        <h2 id="user-name"></h2>
                        <div class="profile-titles" id="user-titles"></div>
                    </div>
                </header>
        
                <!-- Secciones del perfil -->
                <div class="profile-sections">
                    <!-- Columna izquierda -->
                    <div class="profile-left-column">
                        <section class="profile-section">
                            <h3><i class="fas fa-graduation-cap"></i> Formación Académica</h3>
                            <ul class="profile-list" id="education-list"></ul>
                        </section>
        
                        <section class="profile-section">
                            <h3><i class="fas fa-briefcase"></i> Experiencia Laboral</h3>
                            <ul class="profile-list" id="experience-list"></ul>
                        </section>
        
                        <section class="profile-section">
                            <h3><i class="fas fa-code"></i> Habilidades / Tecnologías</h3>
                            <div class="skills-container" id="skills-container"></div>
                        </section>
                    </div>
        
                    <!-- Columna derecha -->
                    <div class="profile-right-column">
                        <section class="profile-section">
                            <h3><i class="fas fa-bell"></i> Notificaciones</h3>
                            <div class="bio-section">
                                <h4>Biografía</h4>
                                <p id="user-bio"></p>
                            </div>
                        </section>
        
                        <section class="profile-section">
                            <h3><i class="fas fa-newspaper"></i> Publicaciones / Actividad Reciente</h3>
                            <div id="publications-container"></div>
                        </section>
                    </div>
                </div>
            </div>
        
            <script src="profile.js"></script>
</body>

</html>
