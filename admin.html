<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <nav class="navbar">
        <h1>Panel de Administración</h1>
        <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
    </nav>

    <div class="container">
        <div class="tab-buttons">
            <button class="tab-button active" onclick="cambiarSeccion('users')">Usuarios</button>
            <button class="tab-button" onclick="cambiarSeccion('posts')">Publicaciones</button>
        </div>

        <div id="usersSection" class="section active">
            <div class="section-title">
                <h2>Gestión de Usuarios</h2>
            </div>
            <table class="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Fecha de Registro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Los usuarios se cargarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>

        <div id="postsSection" class="section">
            <div class="section-title">
                <h2>Gestión de Publicaciones</h2>
            </div>
            <table class="posts-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Autor</th>
                        <th>Contenido</th>
                        <th>Archivo</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="postsTableBody">
                    <!-- Las publicaciones se cargarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Confirmar acción</h3>
            <p id="modalMessage">¿Estás seguro de que deseas realizar esta acción?</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn" onclick="closeModal()">Cancelar</button>
                <button id="confirmButton" class="modal-btn confirm-btn">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        // Verificar autenticación al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = JSON.parse(localStorage.getItem('usuario'));
            if (!usuario || usuario.id_perfil !== 2) {
                window.location.href = 'index.html';
                return;
            }
            cargarUsuarios();
            cargarPublicaciones();
        });

        function cambiarSeccion(seccion) {
            // Actualizar botones
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Actualizar secciones
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(seccion + 'Section').classList.add('active');
        }

        async function cargarUsuarios() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:3000/usuarios', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Error al cargar usuarios');

                const usuarios = await response.json();
                mostrarUsuarios(usuarios);
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar la lista de usuarios');
            }
        }

        async function cargarPublicaciones() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:3000/obtener-publicaciones', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Error al cargar publicaciones');

                const publicaciones = await response.json();
                mostrarPublicaciones(publicaciones);
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar las publicaciones');
            }
        }

        function mostrarUsuarios(usuarios) {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            usuarios.forEach(usuario => {
                const tr = document.createElement('tr');
                const fechaRegistro = new Date(usuario.fecha_registro).toLocaleDateString('es-ES', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                tr.innerHTML = `
                    <td>${usuario.id}</td>
                    <td>${usuario.nombre}</td>
                    <td>${usuario.email}</td>
                    <td class="fecha">${fechaRegistro}</td>
                    <td>
                        <button class="action-btn delete-btn" onclick="confirmarEliminar('usuario', ${usuario.id})">
                            Eliminar
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function mostrarPublicaciones(publicaciones) {
            const tbody = document.getElementById('postsTableBody');
            tbody.innerHTML = '';

            publicaciones.forEach(pub => {
                const tr = document.createElement('tr');
                const fecha = new Date(pub.fecha).toLocaleDateString('es-ES', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                let archivoHTML = '';
                if (pub.archivo) {
                    if (pub.archivo.mimeType.startsWith('image/')) {
                        archivoHTML = `<img src="data:${pub.archivo.mimeType};base64,${pub.archivo.data}" class="post-file" onclick="window.open(this.src)">`;
                    } else if (pub.archivo.mimeType === 'application/pdf') {
                        archivoHTML = `<div class="post-file-container">
                            <button onclick="mostrarPDFPreview('${pub.archivo.data}', ${pub.id_publicacion})" class="post-file-pdf">
                                <i class="fas fa-file-pdf"></i> Ver PDF
                            </button>
                            <a href="data:application/pdf;base64,${pub.archivo.data}" 
                               download="documento_${pub.id_publicacion}.pdf" 
                               class="post-file-pdf">
                                <i class="fas fa-download"></i> Descargar
                            </a>
                        </div>`;
                    }
                }

                tr.innerHTML = `
                    <td>${pub.id_publicacion}</td>
                    <td>${pub.nombre}</td>
                    <td class="post-content">${pub.contenido}</td>
                    <td>${archivoHTML}</td>
                    <td class="fecha">${fecha}</td>
                    <td>
                        <button class="action-btn delete-btn" onclick="confirmarEliminar('publicacion', ${pub.id_publicacion})">
                            Eliminar
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showModal(title, message, onConfirm) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('confirmButton').onclick = onConfirm;
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function confirmarEliminar(tipo, id) {
            const mensajes = {
                usuario: 'este usuario',
                publicacion: 'esta publicación'
            };

            showModal(
                `Confirmar eliminación`,
                `¿Estás seguro de que deseas eliminar ${mensajes[tipo]}? Esta acción no se puede deshacer.`,
                () => eliminarElemento(tipo, id)
            );
        }

        async function eliminarElemento(tipo, id) {
            try {
                const token = localStorage.getItem('token');
                const endpoint = tipo === 'usuario' ?
                    `http://localhost:3000/usuarios/${id}` :
                    `http://localhost:3000/publicacion/${id}`;

                const response = await fetch(endpoint, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error(`Error al eliminar ${tipo}`);

                closeModal();
                if (tipo === 'usuario') {
                    cargarUsuarios();
                } else {
                    cargarPublicaciones();
                }
                alert(`${tipo.charAt(0).toUpperCase() + tipo.slice(1)} eliminado correctamente`);
            } catch (error) {
                console.error('Error:', error);
                alert(`Error al eliminar ${tipo}`);
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html?logout=true';
        }

        function mostrarPDFPreview(base64Data, id) {
            try {
                // Crear un objeto Blob para el PDF
                const byteCharacters = atob(base64Data);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'application/pdf' });

                // Crear URL del blob y abrirlo en una nueva ventana
                const pdfUrl = URL.createObjectURL(blob);
                const newWindow = window.open(pdfUrl, '_blank');

                // Limpiar el URL del blob cuando se cierre la ventana
                if (newWindow) {
                    newWindow.onunload = () => {
                        URL.revokeObjectURL(pdfUrl);
                    };
                }
            } catch (error) {
                console.error('Error al mostrar el PDF:', error);
                alert('Error al mostrar el PDF. Por favor, intente descargarlo.');
            }
        }
    </script>
</body>

</html>
